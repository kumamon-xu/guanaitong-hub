name: Prepare GitHub release
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require valid signing certificates
        type: boolean
        default: true
      create_draft:
        description: Upload validated packages to a draft GitHub Release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
      - name: Build packages and platform manifest
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_SIGNED: ${{ inputs.signed }}
        run: node scripts/build-release.mjs ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
            release/release-*.json
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
  assemble:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Merge and verify complete release metadata
        run: node scripts/merge-release.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: release-complete
          path: release/**
          if-no-files-found: error
          retention-days: 30
      - name: Create reviewable draft release
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            [ "$draft" = "true" ] || { echo "Refusing to replace a published release"; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$tag" --notes-file release/release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" release/*.exe release/*.zip release/release.json release/SHA256SUMS.txt --clobber
